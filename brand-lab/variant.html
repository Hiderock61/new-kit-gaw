<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<title>New Kit Gaw Brand Lab | Preview</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e9e9}iframe{display:block;border:0;width:100%;height:100dvh;min-height:100vh}</style>
</head><body>
<iframe id="demo" title="同じNew Kit Gawの内容・導線を使ったブランド比較" src="../?brand_lab_preview=1"></iframe>
<script>
(function(){
"use strict";
const supported=new Set(["editorial","city","zine"]);
const requested=new URLSearchParams(window.location.search).get("theme")||"editorial";
const theme=supported.has(requested)?requested:"editorial";
const frame=document.getElementById("demo");
frame.addEventListener("load",function(){
 try{
  const child=frame.contentDocument;
  if(!child||!child.documentElement)return;
  child.documentElement.dataset.brandLab=theme;
  if(!child.getElementById("brand-lab-css")){
   const link=child.createElement("link");
   link.id="brand-lab-css";link.rel="stylesheet";
   link.href=new URL("brand-lab/variants.css",frame.contentWindow.location.href).href;
   child.head.appendChild(link);
  }
 }catch(err){
  const p=document.createElement("p");p.textContent="ブランド比較のスタイルを読み込めませんでした。";document.body.appendChild(p);
 }
});
})();
</script>
</body></html>
